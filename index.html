<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>SpeedType Pro</title>
        <link rel="stylesheet" href="style.css"/>
        </head>
        <body>

            <div class="container">
                <h1>SpeedType Pro</h1>
            <p class="subtitle">Train your typing speed like a professional.</p>
                <div class="stats">
                <div class="box">
                    <span id="time">60</span>
                    <p>Time</p>
                </div>
                <div class="box">
                    <span id="wpm">0</span>
                    <p>wpm</p>
                </div>
                <div class="box">
                    <span id="accuracy">100%</span>
                    <p>Accuracy</p>
                </div>    
                </div>
                <div id="text-display"></div>

                <textarea
                 id="text-input"
                 placeholder="Start typing here..."
                 autofocus
                ></textarea>

                <button id="restart-btn">Restart Test</button>
                </div>
        <script src="script.js"></script>
        </body>
        </html>            
</html>
